<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>uBixGate: One door for every agent's MCP tools.</title>
  <rect width="1280" height="640" fill="#151b21"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0f62fe"/>
  <g transform="translate(80 80) scale(3.75)">
    <rect width="32" height="32" fill="#0f62fe"/>
    <path d="M10 25V7.5h12V25" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="square"/>
    <rect x="5.5" y="24" width="21" height="3" fill="#ffffff"/>
    <rect x="14" y="14" width="4" height="4" fill="#ffffff" opacity="0.55"/>
  </g>
  <g font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" fill="#e3e8ec">
    <text x="80" y="300" font-size="112"><tspan font-weight="300">uBix</tspan><tspan font-weight="600">Gate</tspan></text>
    <text x="84" y="372" font-size="40" fill="#b3bec7">One door for every agent's MCP tools.</text>
  </g>
  <!-- deny by default: three requests stop at the door, one is let through -->
  <g fill="none" stroke-width="10">
    <path d="M80 450H650" stroke="#2f7fb0"/>
    <path d="M80 500H700" stroke="#4a6ee8"/>
    <path d="M80 550H650" stroke="#8a4fc0"/>
    <path d="M80 600H650" stroke="#b8406f"/>
    <path d="M820 500H1200" stroke="#7fbfa4"/>
  </g>
  <g fill="#3a4550"><rect x="652" y="432" width="10" height="36"/><rect x="652" y="532" width="10" height="36"/><rect x="652" y="582" width="10" height="36"/></g>
  <path d="M700 590V430h120V590" fill="none" stroke="#e3e8ec" stroke-width="14"/>
  <rect x="676" y="586" width="168" height="14" fill="#e3e8ec"/>
  <rect x="740" y="480" width="40" height="40" fill="#e0a43a"/>
</svg>
