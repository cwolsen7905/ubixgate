name: Release

# Publish a GitHub Release for a version tag. Tags are cut on GitLab, which push-mirrors
# them here. A mirrored tag does not always fire the tag push event, so the workflow can
# also be run by hand against the tag:
#   gh workflow run Release --ref v0.1.0-beta.1
# See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, check and sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign signing of SHA256SUMS via GitHub OIDC
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases are cut on main, including runs started by hand.
      - name: The tag is on main
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "origin/main does not exist here: cannot tell whether $TAG is on main. Refusing to release."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$TAG ($(git rev-parse --short HEAD)) is not on main. Releases are tagged on main only."
            echo "Nothing was published. If main is behind because the mirror is late, re-run once it arrives."
            exit 1
          fi
          echo "$TAG is on main."

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true

      - name: make check
        run: make check

      - name: Release notes from CHANGELOG.md
        run: make --no-print-directory release-notes VERSION="$TAG" > release-notes.md

      - name: Build the archives and SHA256SUMS
        run: make dist VERSION="$TAG"

      - name: Six archives and their checksums
        run: |
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            test -f "dist/ubixgate-$TAG-$t.tar.gz" || { echo "missing $t archive"; exit 1; }
          done
          for t in windows-amd64 windows-arm64; do
            test -f "dist/ubixgate-$TAG-$t.zip" || { echo "missing $t archive"; exit 1; }
          done
          test "$(wc -l < dist/SHA256SUMS)" -eq 6 || { echo "SHA256SUMS should list six archives"; cat dist/SHA256SUMS; exit 1; }
          ls -l dist

      - name: The binary reports the tag
        run: |
          got="$(dist/ubixgate-linux-amd64 version)"
          if [ "$got" != "ubixgate $TAG" ]; then
            echo "tag $TAG, but the binary reports: $got"
            exit 1
          fi
          echo "$got"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # The bundle carries the signature and the short-lived certificate that binds it to
      # this workflow at this tag; verify with cosign verify-blob (docs/RELEASING.md).
      - name: Sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release-notes.md
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create the release
        run: |
          pre=
          case "$TAG" in *-*) pre=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "$TAG" --notes-file release-notes.md \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
