apiVersion: v2
name: ubixgate
description: |
  uBixGate, an MCP gateway: one Streamable HTTP endpoint in front of many MCP servers,
  with OIDC authentication, deny-by-default tool policy, upstream credentials read from a
  Vault-API server at call time, and one audit record per call.
type: application
# Chart version: bump on chart changes, independently of the app.
version: 0.1.0
# The uBixGate release this chart targets. image.tag defaults to it when empty, so it must
# track the current release.
appVersion: "0.1.0-beta.1"
kubeVersion: ">=1.24.0-0"
home: https://github.com/ubixsys/ubixgate
sources:
  - https://github.com/ubixsys/ubixgate
keywords:
  - mcp
  - gateway
  - oidc
  - vault
  - audit
