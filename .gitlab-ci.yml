# CI on the canonical GitLab project. The same gate runs on GitHub (`make check`).
# Checks run in the test stage; approval only in merge request pipelines and promote only
# in dev push pipelines, so the two never meet.
stages: [build, test, deploy, approval, promote]

# Advisory AI review of merge requests (job `kelpie-review`, stage `test`). It posts review
# threads on a merge request into AI_REVIEW_BASE_BRANCH. In advisory mode the included job
# does not fail on findings, and it is allowed to fail only with exit code 75 ("could not
# run"); both behaviours are defined in the included file, not here, so check them when you
# bump the ref. The ref is a commit, not a branch, so the included job cannot change this CI
# unreviewed. Needs the OPENROUTER_API_KEY, AI_REVIEW_GITLAB_TOKEN, KELPIE_REGISTRY_USER and
# KELPIE_REGISTRY_TOKEN group variables; without them the job exits 75 and the pipeline
# stays green. Do not add a bare `allow_failure: true` for it: that would replace the exit
# code rule and stop `blocking` mode from ever failing the job.
include:
  - project: ubixsys/ubixkelpie
    ref: 96e48eee696766768a397e03ec1719ffd5e3647b
    file: ci/kelpie.yml

variables:
  AI_REVIEW_BASE_BRANCH: dev
  AI_REVIEW_MODE: advisory

# One pipeline per push. A merge request gets a merge request pipeline (the one that
# "Pipelines must succeed" judges); the push to its branch then starts no branch pipeline of
# its own. dev and main always get push pipelines (promote-to-main runs there), and so does
# a branch with no open MR, or a tag.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != "dev" && $CI_COMMIT_BRANCH != "main"'
      when: never
    - when: always

.every_pipeline:
  rules:
    - when: on_success

# The repo is public and mirrored, so nothing private may be committed. The pattern of
# private names lives in the PUBLIC_BOUNDARY_PATTERN CI variable (project settings, not the
# repo, so the list itself is not published). The job prints file and line only, never the
# matched text.
public-boundary:
  extends: .every_pipeline
  tags: [shell]
  script:
    - |
      if [ -z "${PUBLIC_BOUNDARY_PATTERN:-}" ]; then
        echo "PUBLIC_BOUNDARY_PATTERN is not set in CI/CD variables; refusing to pass unchecked."
        exit 1
      fi
      hits=$(grep -rniE --exclude-dir=.git -- "$PUBLIC_BOUNDARY_PATTERN" . | cut -d: -f1,2 || true)
      if [ -n "$hits" ]; then
        echo "Private names found (file:line):"
        echo "$hits"
        exit 1
      fi
      echo "Public boundary clean."

# Go jobs run in the official Go image (the shell runner has no Go of its own), as the
# runner's uid so nothing root-owned lands in the checkout. Build, module and lint caches
# live under the runner's home, so later pipelines reuse them.
.go:
  extends: .every_pipeline
  tags: [shell]
  variables:
    GO_IMAGE: golang:1.27
  before_script:
    - mkdir -p "$HOME/.cache/ubixgate-go"
    - |
      go_run() {
        docker run --rm -v "$PWD:/src" -w /src --user "$(id -u):$(id -g)" \
          -v "$HOME/.cache/ubixgate-go:/cache" \
          -e HOME=/tmp -e GOCACHE=/cache/build -e GOMODCACHE=/cache/mod \
          -e GOLANGCI_LINT_CACHE=/cache/lint -e GOFLAGS=-buildvcs=false \
          -e VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" \
          "$GO_IMAGE" sh -c "$1"
      }

# fmt, vet, lint, prose style, size budget, script tests, unit and integration tests.
go-check:
  extends: .go
  script:
    - go_run 'git config --global --add safe.directory /src && go version && make check'

go-cross:
  extends: .go
  script:
    - go_run 'make cross VERSION=$VERSION'
  artifacts:
    paths: [dist/]
    expire_in: 1 week

# The Helm chart: lint, render with every part on, run `ubixgate check` on the rendered
# config (bin/chart-check.sh). helm runs from its own image, ubixgate from the Go image.
chart-check:
  extends: .go
  variables:
    HELM_IMAGE: alpine/helm:4.2.4
  script:
    - export HELM="docker run --rm -v $PWD:/src -w /src --user $(id -u):$(id -g) -e HOME=/tmp $HELM_IMAGE"
    - export UBIXGATE="docker run --rm -v $PWD:/src -w /src --user $(id -u):$(id -g) -v $HOME/.cache/ubixgate-go:/cache -e HOME=/tmp -e GOCACHE=/cache/build -e GOMODCACHE=/cache/mod -e GOFLAGS=-buildvcs=false $GO_IMAGE go run ./cmd/ubixgate"
    - bash bin/chart-check.sh

# The release image's Dockerfile: build it for the runner's platform and check that the
# binary inside runs and reports its version. Nothing is pushed; the image is removed.
image-build:
  extends: .every_pipeline
  tags: [shell]
  timeout: 15 minutes
  script:
    - img="ubixgate-ci:${CI_JOB_ID}"
    - docker build --build-arg VERSION=ci-check -t "$img" .
    - out=$(docker run --rm "$img" version); echo "$out"; docker rmi "$img" >/dev/null
    - test "$out" = "ubixgate ci-check"

# The Docker Compose demo, end to end: build the images, start uBixVault, the demo IdP, the
# fake tracker and the gateway, run demo.sh and check its outcomes (bin/ci/demo-compose.sh).
# Publishes no host ports, so it is safe on the shared runner. It pulls the uBixVault image
# and builds uBixShepherd from source, so it needs network access.
demo-compose:
  extends: .every_pipeline
  tags: [shell]
  timeout: 20 minutes
  script:
    - bash bin/ci/demo-compose.sh
  artifacts:
    when: always
    paths: [demo-output.txt]
    expire_in: 1 week

# dev -> main. main only ever moves by fast-forward from a green dev (bin/promote.sh, which
# fails closed and never forces). Runs only on a push pipeline of dev, after every check
# above has passed. Needs the GITLAB_PROMOTE_TOKEN CI variable (masked and protected).
promote-to-main:
  stage: promote
  tags: [shell]
  needs: [public-boundary, go-check, go-cross, chart-check, demo-compose, image-build]
  resource_group: promote-main
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - bash bin/promote.sh

# Every merge needs a human sign-off: an Approve or a thumbs-up on the MR
# (bin/ci/require-approval.sh). With "Pipelines must succeed" on, this job failing keeps a
# merge waiting for a person. Agents never approve. GitLab does not re-run a pipeline on
# approval: approve, then retry this job.
# APPROVAL_CHECK_TOKEN: project access token, Reporter role, read_api scope. Masked but not
# protected, so MR branches receive it. MERGE_APPROVAL_OWNERS (optional) lists usernames
# whose sign-off counts, including on their own MR.
require-approval:
  stage: approval
  tags: [shell]
  timeout: 5 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - bash bin/ci/require-approval.sh
